<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eiffel Tower Fleet – robotics simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#070d22;--glass:rgba(10,18,44,.62);--line:rgba(160,185,255,.22);--text:#e8eeff;--mute:#9fb0dc;--rover:#ffb35c;--drone:#5ff0d0;--boat:#ff7a9a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:Figtree,system-ui,sans-serif;overflow:hidden}
#bg{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55) saturate(1.2)}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:manipulation}
.panel{position:fixed;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}
#title{top:max(14px,env(safe-area-inset-top));left:14px;padding:12px 16px;max-width:290px}
h1{font:500 15px/1.2 Unbounded,sans-serif;margin:0 0 6px}
#title p{margin:0;font-size:13px;color:var(--mute);line-height:1.45}
#ctl{top:max(14px,env(safe-area-inset-top));right:14px;padding:6px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:min(380px,calc(100vw - 28px))}
button{font:600 13px Figtree,sans-serif;color:var(--text);background:transparent;border:1px solid transparent;border-radius:9px;padding:8px 12px;cursor:pointer}
button:hover{background:rgba(160,185,255,.14)}
button[aria-pressed=true]{background:rgba(160,185,255,.2);border-color:var(--line)}
button:focus-visible{outline:2px solid var(--drone);outline-offset:1px}
#tel{left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));padding:8px;display:flex;gap:8px;overflow-x:auto}
.chip{flex:0 0 auto;min-width:122px;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.05);font-size:12px}
.chip b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip span{color:var(--mute)}
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}
.bar u{display:block;height:100%}
#set{top:132px;left:14px;width:250px;padding:10px 12px;max-height:calc(100% - 240px);overflow-y:auto}#set label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px;color:var(--mute);margin-bottom:9px}#set output{color:var(--text);font-weight:600}#set input{grid-column:1/-1;width:100%;accent-color:#5ff0d0;margin:0}#set h2{font:500 11px Unbounded,sans-serif;margin:10px 0 8px;color:var(--text)}#set h2:first-child{margin-top:0}
@media(max-width:700px){#title p{display:none}}
</style></head>
<body>
<div id="bg"></div>
<canvas id="c" aria-label="Robot fleet simulation at the Eiffel Tower"></canvas>
<div class="panel" id="title"><h1>Eiffel Tower Fleet</h1><p>Click the park paths, the tower or the sky to dispatch the nearest robot there.</p></div>
<div class="panel" id="ctl">
<button id="bT" aria-pressed="true">Tune</button>
<button id="bM" aria-pressed="true">Mesh links</button><button id="bP" aria-pressed="true">Routes</button><button id="bS">Pause</button>
</div>
<div class="panel" id="set"></div>
<div class="panel" id="tel"></div>

 if(best){const c=units.filter(b=>b.rk===best.k&&b.state==='patrol').sort((a,b)=>Math.abs(a.idx-best.i)-Math.abs(b.idx-best.i));
  if(c[0]){u=c[0];u.target=best.i;u.state='goto';const p=ROUTES[best.k][best.i];u.beacon={x:p[0],y:p[1]}}}
 if(!u){u=units.filter(b=>b.type==='drone'&&b.state==='patrol').sort((a,b)=>Math.hypot(a.pos.x-x,a.pos.y-y)-Math.hypot(b.pos.x-x,b.pos.y-y))[0];
  if(u){u.tg={x,y:y-38};u.state='goto';u.beacon={x,y}}}
});

function glowLine(pts,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
 for(let i=1;i<pts.length;i++){ctx.globalAlpha=i/pts.length*.7;ctx.beginPath();ctx.moveTo(pts[i-1][0],pts[i-1][1]);ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke()}ctx.globalAlpha=1}
function tag(u){const t=u.name+' '+u.label.toLowerCase();ctx.font='600 10px Figtree,sans-serif';const w=ctx.measureText(t).width+12;
 ctx.fillStyle='rgba(8,14,40,.78)';ctx.beginPath();ctx.roundRect(u.pos.x-w/2,u.pos.y-34,w,16,6);ctx.fill();
 ctx.fillStyle=C[u.type];ctx.textAlign='center';ctx.fillText(t,u.pos.x,u.pos.y-23);}
function rings(u){const g=ctx.globalCompositeOperation;ctx.globalCompositeOperation='lighter';ctx.strokeStyle=C[u.type];
 for(let k=0;k<2;k++){const f=((T*.9+k*.5)%1);ctx.globalAlpha=(1-f)*.7;ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(u.pos.x,u.pos.y,6+f*26,(6+f*26)*.45,0,0,7);ctx.stroke()}
 ctx.globalAlpha=1;ctx.globalCompositeOperation=g}

function drawWalker(b){const f=Math.cos(b.h)>=0?1:-1,idle=b.state==='charge'||b.state==='scan',ph=idle?0:T*9+b.idx*.3;ctx.save();ctx.translate(b.pos.x,b.pos.y);ctx.scale(f,1);
 ctx.shadowColor=C.walker;ctx.shadowBlur=9*S.glow;ctx.strokeStyle=C.walker;ctx.lineWidth=1.7;ctx.lineCap='round';
 for(const[x,o]of[[-6,0],[-6,3.1],[6,3.1],[6,0]]){const a=Math.sin(ph+o),l=idle?0:Math.max(0,Math.cos(ph+o))*2.5;ctx.beginPath();ctx.moveTo(x,-3);ctx.lineTo(x+a*3,2);ctx.lineTo(x+a*6,8-l);ctx.stroke()}
 ctx.fillStyle='#141a3c';ctx.lineWidth=1.3;ctx.beginPath();ctx.roundRect(-10,-10,20,8,3);ctx.fill();ctx.stroke();ctx.beginPath();ctx.roundRect(8,-14,7,7,2);ctx.fill();ctx.stroke();
 ctx.shadowBlur=0;ctx.fillStyle=C.drone;ctx.fillRect(11,-12,4,2);ctx.beginPath();ctx.moveTo(-7,-10);ctx.lineTo(-10,-16);ctx.stroke();
 ctx.fillStyle=Math.sin(T*5)>0?'#ff4466':'#7dff9c';ctx.beginPath();ctx.arc(-10,-16.5,1.4,0,7);ctx.fill();ctx.restore()}
function drawBlimp(b){const f=Math.cos(b.h)>=0?1:-1;ctx.save();ctx.translate(b.pos.x,b.pos.y);ctx.scale(f,1);
 if(b.state==='scan'||b.state==='goto'){ctx.globalCompositeOperation='lighter';const g=ctx.createLinearGradient(0,8,0,50);g.addColorStop(0,'rgba(255,190,200,.45)');g.addColorStop(1,'rgba(255,190,200,.03)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-2,8);ctx.lineTo(16,50);ctx.lineTo(-16,50);ctx.lineTo(2,8);ctx.fill();ctx.globalCompositeOperation='source-over'}
 ctx.shadowColor=C.blimp;ctx.shadowBlur=11*S.glow;ctx.fillStyle='#141a3c';ctx.strokeStyle=C.blimp;ctx.lineWidth=1.3;
 ctx.beginPath();ctx.ellipse(0,0,20,7.5,0,0,7);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(-16,-2);ctx.lineTo(-25,-9);ctx.lineTo(-22,0);ctx.lineTo(-25,9);ctx.lineTo(-16,2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
 ctx.fillStyle='#0b1230';ctx.fillRect(-4,7,9,4);ctx.strokeRect(-4,7,9,4);
 ctx.fillStyle=`hsl(${(T*80)%360},90%,65%)`;ctx.fillRect(-13,-1.5,26,3);ctx.restore()}
function drawRover(b){ctx.save();ctx.translate(b.pos.x,b.pos.y);ctx.rotate(b.h);
 if(b.state!=='charge'){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,S.glow);const g=ctx.createLinearGradient(7,0,40,0);g.addColorStop(0,'rgba(255,215,150,.55)');g.addColorStop(1,'rgba(255,215,150,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(7,-1.5);ctx.lineTo(40,-13);ctx.lineTo(40,13);ctx.lineTo(7,1.5);ctx.fill();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
 ctx.shadowColor=C.rover;ctx.shadowBlur=9*S.glow;ctx.fillStyle='#111b3b';ctx.strokeStyle=C.rover;ctx.lineWidth=1.2;
 ctx.beginPath();ctx.roundRect(-8,-5,16,10,3);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
 ctx.fillStyle='#05091c';for(const [x,y] of[[-6,-6.4],[3,-6.4],[-6,4.4],[3,4.4]])ctx.fillRect(x,y,4,2);
 ctx.fillStyle='#27407f';ctx.fillRect(-3,-2.5,6,5);
 ctx.fillStyle=b.state==='charge'?'#7dff9c':C.drone;ctx.globalAlpha=.6+.4*Math.sin(T*6);ctx.beginPath();ctx.arc(4.5,0,1.6,0,7);ctx.fill();ctx.restore()}
function drawBoat(b){ctx.save();ctx.translate(b.pos.x,b.pos.y);ctx.rotate(b.h);
 ctx.shadowColor=C.boat;ctx.shadowBlur=9*S.glow;ctx.fillStyle='#121a3a';ctx.strokeStyle=C.boat;ctx.lineWidth=1.2;
 ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(5,4.5);ctx.lineTo(-10,4.5);ctx.lineTo(-10,-4.5);ctx.lineTo(5,-4.5);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;
 ctx.fillStyle='#2a4488';ctx.fillRect(-5,-2.5,7,5);
 ctx.fillStyle=Math.sin(T*4)>0?'#ff4466':'#7dff9c';ctx.beginPath();ctx.arc(-9,0,1.5,0,7);ctx.fill();ctx.restore()}
function drawDrone(d){const{x,y}=d.pos,act=d.state==='goto'||d.state==='scan';
 ctx.globalCompositeOperation='lighter';
 if(act){const g=ctx.createLinearGradient(x,y,x,y+38);g.addColorStop(0,'rgba(95,240,208,.5)');g.addColorStop(1,'rgba(95,240,208,.08)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-2,y+2);ctx.lineTo(x+13,y+38);ctx.lineTo(x-13,y+38);ctx.lineTo(x+2,y+2);ctx.fill()}
 else if(d.state==='patrol'){const ty=IN.y0+(IN.y1-IN.y0)*(.5+.5*Math.sin(T*.7+d.ph)),g=ctx.createLinearGradient(x,y,IN.x,ty);
  g.addColorStop(0,'rgba(95,240,208,.28)');g.addColorStop(1,'rgba(95,240,208,.04)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(IN.x,ty-6);ctx.lineTo(IN.x,ty+6);ctx.fill();
  ctx.fillStyle='rgba(180,255,240,.8)';ctx.beginPath();ctx.arc(IN.x,ty,1.8,0,7);ctx.fill()}
 ctx.globalCompositeOperation='source-over';ctx.save();ctx.translate(x,y);
 ctx.strokeStyle='#cfe3ff';ctx.lineWidth=1;
 for(const[a,b]of[[-7,-6],[7,-6],[-7,6],[7,6]]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(a,b);ctx.stroke();
  ctx.fillStyle='rgba(120,230,255,.28)';ctx.beginPath();ctx.arc(a,b,4.5,0,7);ctx.fill();
  const r=d.ro+a*3;ctx.beginPath();ctx.moveTo(a-4.5*Math.cos(r),b-4.5*Math.sin(r));ctx.lineTo(a+4.5*Math.cos(r),b+4.5*Math.sin(r));ctx.stroke()}
 ctx.shadowColor=C.drone;ctx.shadowBlur=10*S.glow;ctx.fillStyle='#0b1534';ctx.strokeStyle=C.drone;ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(0,0,3.4,0,7);ctx.fill();ctx.stroke();
 ctx.shadowBlur=0;ctx.fillStyle=d.state==='charge'?'#7dff9c':'#ff4466';ctx.globalAlpha=.5+.5*Math.sin(T*8);ctx.beginPath();ctx.arc(0,0,1.2,0,7);ctx.fill();ctx.restore()}

function fxBack(){const h=(S.hue+S.cyc*T*40)%360;
 if(S.tglow>0){ctx.save();ctx.beginPath();for(const pg of POLY){pg.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()}ctx.clip();
  ctx.globalCompositeOperation='hue';ctx.globalAlpha=Math.min(1,S.tglow*1.6);ctx.fillStyle=`hsl(${h},100%,50%)`;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=S.tglow*(.2+.1*Math.sin(T*1.3));ctx.fillRect(0,0,W,H);ctx.restore();
  const g=ctx.createRadialGradient(GC[0],GC[1],20,GC[0],GC[1],GR);g.addColorStop(0,`hsla(${h},100%,60%,${.28*S.tglow})`);g.addColorStop(1,`hsla(${h},100%,60%,0)`);
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const f=(T%4)/4;ctx.strokeStyle=`hsla(${h},100%,70%,${(1-f)*.55*S.tglow})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(SC[0],SC[1],40+f*SR[0],12+f*SR[1],0,0,7);ctx.stroke()}
 ctx.globalCompositeOperation='lighter';
 for(const g of glints){const a=Math.pow(.5+.5*Math.sin(T*g.s+g.p),3)*.8*Math.min(1,S.glow);ctx.fillStyle=`rgba(${CFG.glints.col},${a})`;ctx.fillRect(g.x-g.s*3,g.y,g.s*6,1);if(CFG.glints.star)ctx.fillRect(g.x,g.y-g.s*3,1,g.s*6)}
 ctx.globalCompositeOperation='source-over'}
function fxFront(){ctx.globalCompositeOperation='lighter';
 const n=Math.round(S.fly*flies.length);for(let i=0;i<n;i++){const f=flies[i],a=(.5+.5*Math.sin(T*2.2*f.s+f.p*5))*.9*Math.min(1.2,S.glow),g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,6);
  g.addColorStop(0,`rgba(190,255,160,${a})`);g.addColorStop(1,'rgba(190,255,160,0)');ctx.fillStyle=g;ctx.fillRect(f.x-6,f.y-6,12,12)}
 for(const p of sparks){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,7);ctx.fill()}
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 if(S.rain>0){ctx.strokeStyle='rgba(190,210,255,.35)';ctx.lineWidth=1;ctx.beginPath();const m=Math.round(S.rain*rainD.length);
  for(let i=0;i<m;i++){const d=rainD[i];ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+3.5*d.s,d.y-20*d.s)}ctx.stroke();ctx.fillStyle=`rgba(10,20,50,${S.rain*.18})`;ctx.fillRect(0,0,W,H)}}
function draw(){const d=V.d;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
 ctx.setTransform(V.s*d,0,0,V.s*d,V.ox*d,V.oy*d);
 ctx.save();ctx.beginPath();ctx.roundRect(0,0,W,H,10);ctx.clip();
 if(img.complete)ctx.drawImage(img,0,0,W,H);
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgba(8,14,50,${S.tint*.35})`);g.addColorStop(1,`rgba(4,8,28,${S.tint})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 fxBack();
 if(show.routes){ctx.lineWidth=1.2;ctx.setLineDash([4,7]);ctx.lineDashOffset=-T*10;
  for(const k in ROUTES){ctx.strokeStyle=k==='aux'?CFG.kind==='walker'?'rgba(181,140,255,.5)':'rgba(255,122,154,.45)':'rgba(255,179,92,.42)';ctx.beginPath();ROUTES[k].forEach((p,i)=>i%3===0&&(i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])));ctx.stroke()}
  ctx.setLineDash([])}
 for(const u of units)if(u.beacon){const f=(T*.8)%1,{x,y}=u.beacon;ctx.strokeStyle='#fff';ctx.globalAlpha=1-f;ctx.lineWidth=1.3;ctx.beginPath();ctx.ellipse(x,y,5+f*16,(5+f*16)*.5,0,0,7);ctx.stroke();
  ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x+4,y);ctx.lineTo(x,y+5);ctx.lineTo(x-4,y);ctx.fill()}
 ctx.globalCompositeOperation='lighter';
 for(const u of units)if(u.trail.length>1)glowLine(u.trail,C[u.type],u.type==='blimp'?2.4:1.6);
 if(show.mesh){ctx.lineWidth=1;ctx.setLineDash([2,5]);ctx.lineDashOffset=-T*14;
  for(let i=0;i<units.length;i++)for(let j=i+1;j<units.length;j++){const a=units[i].pos,b=units[j].pos,dd=Math.hypot(a.x-b.x,a.y-b.y);
   if(dd<S.mesh){ctx.strokeStyle=`rgba(140,190,255,${(1-dd/S.mesh)*.55})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
  ctx.setLineDash([])}
 ctx.globalCompositeOperation='source-over';
 for(const u of units){if(u.state==='scan'&&u.type!=='drone')rings(u);if(u.type==='rover')drawRover(u);else if(u.type==='walker')drawWalker(u);else if(u.type==='blimp')drawBlimp(u)}
 for(const u of units)if(u.type==='drone'){if(u.state==='scan')rings({pos:{x:u.pos.x,y:u.pos.y+38},type:'drone'});drawDrone(u)}
 ctx.globalAlpha=1;for(const u of units)if(u.state==='scan'||u.state==='goto')tag(u);fxFront();
 ctx.restore()}

let last=performance.now(),paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){const dt=Math.min(.05,(now-last)/1000)*S.speed;last=now;if(!paused){T+=dt;units.forEach(u=>u.update(dt));fx(dt)}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function tel(){$('#tel').innerHTML=units.map(u=>{const b=Math.max(0,Math.min(100,u.bat));
 return`<div class="chip"><b><i style="background:${C[u.type]}"></i>${u.name}</b><span>${u.label}, ${Math.round(b)}%</span><div class="bar"><u style="width:${b}%;background:${b<25?'#ff6f91':C[u.type]}"></u></div></div>`}).join('')}
tel();setInterval(tel,400);

const tog=(id,k)=>$(id).onclick=e=>{show[k]=!show[k];e.target.setAttribute('aria-pressed',show[k])};tog('#bM','mesh');tog('#bP','routes');
$('#bS').textContent=paused?'Resume':'Pause';
$('#bS').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};
const SL=['Fleet',['Rovers','nR',0,9,1],['Drones','nD',0,6,1],[CFG.auxPl,'nB',0,4,1],['Sim speed','speed',0,3,.05],
 'Motion',['Trail length','trail',0,60,1],['Orbit radius','orbit',.5,1.6,.05],['Mesh range','mesh',80,500,10],
 'Light',['Light glow','glow',0,2,.05],['Night darkness','tint',0,.7,.02],['Tower glow','tglow',0,1,.02],['Tower hue','hue',0,360,1],['Hue cycle','cyc',0,1,.05],
 'Weather',['Rain','rain',0,1,.02],['Fireflies','fly',0,1,.02]];
const fleet={nR:'rover',nD:'drone',nB:CFG.kind},id={rover:4,drone:2,[CFG.kind]:1};
const mk={rover:()=>{const n=++id.rover;return new Bot('rover','Rover '+n,rk[n%3],Math.random(),rnd(24,38),Math.random()<.5?1:-1)},
 drone:()=>{const n=++id.drone;return new Drone('Drone '+n,rnd(150,270),rnd(30,70),rnd(0,6.28),rnd(.3,.55)*(Math.random()<.5?1:-1))},
 [CFG.kind]:()=>{const n=++id[CFG.kind];return new Bot(CFG.kind,CFG.aux+' '+n,'aux',Math.random(),rnd(18,26),Math.random()<.5?1:-1)}};
function sync(t,n){const c=units.filter(u=>u.type===t);while(c.length<n){const u=mk[t]();units.push(u);c.push(u)}while(c.length>n)units.splice(units.indexOf(c.pop()),1)}
$('#set').innerHTML=SL.map(r=>typeof r==='string'?`<h2>${r}</h2>`:`<label>${r[0]}<output id="o_${r[1]}">${S[r[1]]}</output><input type="range" id="s_${r[1]}" min="${r[2]}" max="${r[3]}" step="${r[4]}" value="${S[r[1]]}"></label>`).join('');
for(const r of SL)if(typeof r!=='string'){const k=r[1];$('#s_'+k).oninput=e=>{S[k]=+e.target.value;$('#o_'+k).textContent=S[k];if(fleet[k])sync(fleet[k],S[k])}}
$('#bT').onclick=e=>{const s=$('#set');s.hidden=!s.hidden;e.target.setAttribute('aria-pressed',!s.hidden)};
if(innerWidth<700){$('#set').hidden=true;$('#bT').setAttribute('aria-pressed','false')}
</script></body></html>
